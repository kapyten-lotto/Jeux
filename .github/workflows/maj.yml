name: Mise à jour des tirages
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mois:
        description: "Nombre de mois précédents à relire (0 = page actuelle seulement)"
        default: "0"
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python maj.py "$MOIS"
        env:
          MOIS: ${{ github.event.inputs.mois || '0' }}
      - run: |
          if [ -n "$(git status --porcelain tirages.txt)" ]; then
            git config user.name "maj-auto"
            git config user.email "maj-auto@users.noreply.github.com"
            git add tirages.txt
            git commit -m "Mise à jour des tirages"
            git push
          fi
